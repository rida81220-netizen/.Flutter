
name: Flutter SO Build By ЯK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build Flutter SO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DART_VERSION="3.12.2"
          FLUTTER_VERSION="3.44.2"

          echo "Building Dart $DART_VERSION / Flutter $FLUTTER_VERSION"

          wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz

          tar xf flutter_linux_${FLUTTER_VERSION}-stable.tar.xz

          export PATH=$PWD/flutter/bin:$PATH

          flutter --version

          flutter create flutter_so

          cd flutter_so

          flutter pub get

          flutter build apk \
            --target-platform android-arm,android-arm64

          cd ..

          BASE_PATH="flutter_so/build/app/intermediates/stripped_native_libs"

          SO_ARM64=$(find "$BASE_PATH" -path "*/arm64-v8a/libflutter.so" -print -quit)
          SO_ARMEABI=$(find "$BASE_PATH" -path "*/armeabi-v7a/libflutter.so" -print -quit)

          mkdir -p release/arm64
          mkdir -p release/armeabi_v7a

          cp "$SO_ARM64" release/arm64/libflutter.so
          cp "$SO_ARMEABI" release/armeabi_v7a/libflutter.so

          cd release

          zip -qr libflutter_so_arm64.zip arm64
          zip -qr libflutter_so_armeabi_v7a.zip armeabi_v7a

          gh release create "v${DART_VERSION}" \
            libflutter_so_arm64.zip \
            libflutter_so_armeabi_v7a.zip \
            --title "Flutter SO Dart ${DART_VERSION}" \
            --notes "Flutter ${FLUTTER_VERSION}"
